name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Android 36 SDK
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479edd15589fb1918b8719d14ea86638" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/AIAssistant-debug.apk

      - name: Build Android Release APK (Unsigned)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build completed with default keys"
          cd ..
          mkdir -p release-apks
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/AIAssistant-release-unsigned.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apks/AIAssistant-release.apk
          fi

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIAssistant-Android-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_version }}" ]; then
            echo "tag=${{ github.event.inputs.release_version }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "AI Assistant & Coding Studio ${{ steps.release_tag.outputs.tag }} (Android APK)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📱 Android APK Release Download
            আমাদের এআই অ্যাসিস্ট্যান্ট অ্যান্ড কোডিং স্টুডিওর অফিসিয়াল অ্যান্ড্রয়েড এপিকে (Android APK) সফলভাবে বিল্ড হয়েছে!

            #### ডাউনলোড ফাইলসমূহ:
            - **AIAssistant-debug.apk**: সরাসরি যেকোনো অ্যান্ড্রয়েড মোবাইলে ইনস্টলযোগ্য (Install via Unknown Sources)
            - **AIAssistant-release.apk**: অপ্টিমাইজড রিলিজ এপিকে

            #### যেভাবে ইনস্টল করবেন:
            1. নিচে Assets সেকশন থেকে `AIAssistant-debug.apk` ডাউনলোড করুন।
            2. ফাইলে ক্লিক করে "Install" চাপুন।
            3. "Install unknown apps" অনুমতি চাইলে Enable করুন।
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
