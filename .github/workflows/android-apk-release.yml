name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version Tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/AIAssistant-debug.apk

      - name: Build Android Release APK (Unsigned)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || echo "Release build completed with default keys"
          cd ..
          mkdir -p release-apks
          if [ -f "android/app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-apks/AIAssistant-release-unsigned.apk
          elif [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-apks/AIAssistant-release.apk
          fi

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIAssistant-Android-APKs
          path: release-apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_version || github.ref_name }}
          name: "AI Assistant & Coding Studio ${{ github.event.inputs.release_version || github.ref_name }} (Android APK)"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 📱 Android APK Release Download
            আমাদের এআই অ্যাসিস্ট্যান্ট অ্যান্ড কোডিং স্টুডিওর অফিসিয়াল অ্যান্ড্রয়েড এপিকে (Android APK) প্রস্তুত!

            #### ডাউনলোড ফাইলসমূহ:
            - **AIAssistant-debug.apk**: সরাসরি যেকোনো অ্যান্ড্রয়েড ডিভাইসে ইনস্টলযোগ্য (Install via Unknown Sources/Package Installer)
            - **AIAssistant-release.apk**: প্রোডাকশন অপ্টিমাইজড রিলিজ বিল্ড

            #### যেভাবে ইনস্টল করবেন:
            1. নিচে থাকা `AIAssistant-debug.apk` ফাইলে ক্লিক করে ডাউনলোড করুন।
            2. নোটিফিকেশন বার অথবা ডাউনলোড ফোল্ডার থেকে ফাইলটি খুলুন।
            3. "Install from Unknown Sources" বা "অনুমতি দিন" চাপুন।
            4. অ্যাপসটি আপনার হোম স্ক্রিনে যুক্ত হয়ে যাবে!
          files: release-apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
